pluginManagement {
    def baseProps = new Properties()
    file('gradle.properties').withInputStream { baseProps.load(it) }

    def mcVersion = settings.startParameter.projectProperties.get('mcVersion') ?: baseProps.getProperty('mcVersion', '1.21.11')
    def versionProps = new Properties()
    versionProps.putAll(baseProps)
    def versionFile = file("versions/${mcVersion}.properties")
    if (versionFile.exists()) {
        versionFile.withInputStream { versionProps.load(it) }
    }
    def loomPlugin = versionProps.getProperty('loom_plugin', 'fabric-loom')
    def loomVersion = versionProps.getProperty('loom_version', '1.13-SNAPSHOT')
    def moddevVersion = versionProps.getProperty('moddev_version', '2.0.123')
    def unobfuscated = loomPlugin == 'net.fabricmc.fabric-loom'

    settings.ext.mcVersion = mcVersion
    settings.ext.loomPlugin = loomPlugin
    settings.ext.loomVersion = loomVersion
    settings.ext.unobfuscated = unobfuscated

    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
    plugins {
        // Only the active Loom flavour — declaring both polluted 1.21.11 with Loom 1.18.x
        id "${loomPlugin}" version "${loomVersion}"
        id 'net.neoforged.moddev' version "${moddevVersion}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

gradle.ext.mcVersion = settings.ext.mcVersion
gradle.ext.loomPlugin = settings.ext.loomPlugin
gradle.ext.loomVersion = settings.ext.loomVersion
gradle.ext.unobfuscated = settings.ext.unobfuscated

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'weight-challenge'
include('common')
include('fabric')
include('neoforge')

// Select the Fabric build script that applies the correct Loom plugin ID
project(':fabric').buildFileName = settings.ext.unobfuscated ? 'build.unobf.gradle' : 'build.remap.gradle'
